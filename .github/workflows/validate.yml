name: Validate KlpInstall

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell and safe plan mode
        shell: powershell
        run: .\tests\Validate-KlpInstall.ps1
