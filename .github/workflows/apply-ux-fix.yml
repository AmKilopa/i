name: Apply path-only known-folder fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-ux-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Make known-folder setup path-only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'i.ps1'
          $text = Get-Content -LiteralPath $path -Raw

          if (-not $text.Contains("`$ScriptVersion = '4.1.0'")) { throw 'Expected installer version 4.1.0 not found' }
          $text = $text.Replace("`$ScriptVersion = '4.1.0'", "`$ScriptVersion = '4.2.0'")

          # Remove the entire copy helper block.
          $copyStart = $text.IndexOf('function Copy-KnownFolderContent {')
          $layoutStart = $text.IndexOf('function Set-KnownFolderLayout {')
          if ($copyStart -lt 0 -or $layoutStart -lt 0 -or $layoutStart -le $copyStart) {
              throw 'Could not locate known-folder copy/layout functions'
          }
          $text = $text.Substring(0, $copyStart) + $text.Substring($layoutStart)

          # Remove every remaining line that invokes the copy helper, regardless of spacing.
          $text = [regex]::Replace(
              $text,
              '(?m)^.*Copy-KnownFolderContent\s+-Source.*(?:\r?\n|$)',
              '                # Path-only mode: existing files remain untouched.' + "`r`n"
          )

          $oldCreate = '            New-Item -ItemType Directory -Path $target -Force | Out-Null'
          $newCreate = $oldCreate + "`r`n" + '            Write-Info "Path only: $($spec.Name) -> $target (existing files are not moved)"'
          if (-not $text.Contains($oldCreate)) { throw 'Known-folder directory creation line not found' }
          $text = $text.Replace($oldCreate, $newCreate)

          $oldQuestion = "@{ Key = 'KnownFolders'; Label = 'Windows personal folders'; Question = 'Move Desktop, Documents, Downloads, Pictures, Music, Videos and Saved Games to D:?'; Default = `$true; Application = `$false }"
          $newQuestion = "@{ Key = 'KnownFolders'; Label = 'Windows personal folders (paths only)'; Question = 'Set Desktop, Documents, Downloads, Pictures, Music, Videos and Saved Games paths to D: without moving existing files?'; Default = `$true; Application = `$false }"
          if (-not $text.Contains($oldQuestion)) { throw 'Known-folder selection text not found' }
          $text = $text.Replace($oldQuestion, $newQuestion)

          $text = $text.Replace('Existing personal files are copied to D: and preserved at the source.', 'Existing personal files are NOT copied or moved.')

          # Hard guard: the generated installer must contain no migration implementation.
          if ($text.Contains('function Copy-KnownFolderContent')) { throw 'Copy helper still exists after patch' }
          if ($text.Contains('Copy-KnownFolderContent')) { throw 'Copy helper reference still exists after patch' }
          if ($text.Contains('robocopy.exe')) { throw 'robocopy migration code still exists after patch' }
          if ($text.Contains('Existing personal files are copied to D:')) { throw 'Old copy description still exists after patch' }

          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $path), $text, (New-Object System.Text.UTF8Encoding($false)))

      - name: Validate installer
        shell: powershell
        run: .\tests\Validate-KlpInstall.ps1

      - name: Commit path-only behavior
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add i.ps1
          git commit -m 'fix: configure known folders without moving user files'
          git push
