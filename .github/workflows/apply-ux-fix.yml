name: Apply path-only known-folder fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-ux-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Remove user-file migration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'i.ps1'
          $text = Get-Content -LiteralPath $path -Raw

          if (-not $text.Contains("`$ScriptVersion = '4.1.0'")) { throw 'Expected installer version 4.1.0 not found' }
          $text = $text.Replace("`$ScriptVersion = '4.1.0'", "`$ScriptVersion = '4.2.0'")

          $copyPattern = '(?s)function Copy-KnownFolderContent \{.*?\r?\n\}\r?\n\r?\n(?=function Set-KnownFolderLayout)'
          if (-not [regex]::IsMatch($text, $copyPattern)) { throw 'Copy-KnownFolderContent function not found' }
          $text = [regex]::Replace($text, $copyPattern, '', 1)

          $callPattern = '(?m)^\s*if \(-not \(Copy-KnownFolderContent -Source \$current -Destination \$target\)\) \{ throw "Could not copy existing files from \$current" \}\r?\n'
          if (-not [regex]::IsMatch($text, $callPattern)) { throw 'Known-folder copy call not found' }
          $text = [regex]::Replace($text, $callPattern, '', 1)

          $oldCreate = '            New-Item -ItemType Directory -Path $target -Force | Out-Null'
          $newCreate = $oldCreate + "`r`n" + '            Write-Info "Path only: $($spec.Name) -> $target (existing files are not moved)"'
          if (-not $text.Contains($oldCreate)) { throw 'Known-folder directory creation line not found' }
          $text = $text.Replace($oldCreate, $newCreate)

          $oldQuestion = "@{ Key = 'KnownFolders'; Label = 'Windows personal folders'; Question = 'Move Desktop, Documents, Downloads, Pictures, Music, Videos and Saved Games to D:?'; Default = `$true; Application = `$false }"
          $newQuestion = "@{ Key = 'KnownFolders'; Label = 'Windows personal folders (paths only)'; Question = 'Set Desktop, Documents, Downloads, Pictures, Music, Videos and Saved Games paths to D: without moving existing files?'; Default = `$true; Application = `$false }"
          if (-not $text.Contains($oldQuestion)) { throw 'Known-folder selection text not found' }
          $text = $text.Replace($oldQuestion, $newQuestion)

          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $path), $text, (New-Object System.Text.UTF8Encoding($false)))

          $testsPath = 'tests/Validate-KlpInstall.ps1'
          $tests = Get-Content -LiteralPath $testsPath -Raw
          $anchor = "Write-Host 'KlpInstall validation passed.' -ForegroundColor Green"
          $guards = @'
          # Known-folder setup must only change paths. It must never copy or move user files.
          if ($installer -match [regex]::Escape('Copy-KnownFolderContent')) { throw 'User-file copy helper must not exist' }
          if ($installer -match [regex]::Escape('robocopy.exe')) { throw 'Installer must not use robocopy for known-folder setup' }
          if ($installer -match 'Could not copy existing files') { throw 'Known-folder copy path must not return' }

          '@
          if (-not $tests.Contains($anchor)) { throw 'Validation anchor not found' }
          $tests = $tests.Replace($anchor, $guards + $anchor)
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $testsPath), $tests, (New-Object System.Text.UTF8Encoding($false)))

      - name: Validate installer
        shell: powershell
        run: .\tests\Validate-KlpInstall.ps1

      - name: Commit path-only behavior
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add i.ps1 tests/Validate-KlpInstall.ps1
          git commit -m 'fix: configure known folders without moving user files'
          git push
