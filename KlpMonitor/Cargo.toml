[package]
name = "computer-monitor"
version = "0.0.1"
edition = "2024"
default-run = "computer-dashboard"

[lib]
name = "computer_monitor"
path = "src/lib.rs"

[[bin]]
name = "computer-agent"
path = "src/bin/agent.rs"

[[bin]]
name = "computer-dashboard"
path = "src/bin/dashboard.rs"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.7", features = ["ws"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
chrono = "0.4.45"
crossterm = "0.29.0"
futures-util = "0.3.31"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sysinfo = "0.39.6"
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = "0.29.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
